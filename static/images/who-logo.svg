<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Universal Health Organization / WHO Emblem SVG -->
  <defs>
    <linearGradient id="whoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008dc9" />
      <stop offset="100%" stop-color="#005a9c" />
    </linearGradient>
  </defs>
  
  <!-- Outer Circular Border -->
  <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="#008dc9" stroke-width="3" />
  
  <!-- Laurel Wreath Leaves (Left and Right) -->
  <g fill="#008dc9" opacity="0.85">
    <!-- Left Leaves -->
    <path d="M 52 148 C 42 130, 40 106, 48 84 C 50 88, 52 94, 52 98 C 46 112, 48 132, 58 144 Z" />
    <path d="M 46 122 C 34 116, 32 98, 40 88 C 42 94, 46 98, 48 102 C 44 108, 44 116, 46 122 Z" />
    <path d="M 52 92 C 44 82, 46 68, 56 60 C 58 66, 60 72, 60 76 C 56 80, 54 86, 52 92 Z" />
    <path d="M 66 68 C 60 56, 66 44, 78 40 C 78 46, 78 52, 76 56 C 72 60, 68 64, 66 68 Z" />
    
    <!-- Right Leaves -->
    <path d="M 148 148 C 158 130, 160 106, 152 84 C 150 88, 148 94, 148 98 C 154 112, 152 132, 142 144 Z" />
    <path d="M 154 122 C 166 116, 168 98, 160 88 C 158 94, 154 98, 152 102 C 156 108, 156 116, 154 122 Z" />
    <path d="M 148 92 C 156 82, 154 68, 144 60 C 142 66, 140 72, 140 76 C 144 80, 146 86, 148 92 Z" />
    <path d="M 134 68 C 140 56, 134 44, 122 40 C 122 46, 122 52, 124 56 C 128 60, 132 64, 134 68 Z" />
  </g>

  <!-- World Grid Spherical Lines -->
  <circle cx="100" cy="100" r="54" fill="none" stroke="#008dc9" stroke-width="1.8" stroke-dasharray="2,2" opacity="0.6"/>
  <ellipse cx="100" cy="100" rx="34" ry="54" fill="none" stroke="#008dc9" stroke-width="1.2" opacity="0.4"/>
  <ellipse cx="100" cy="100" rx="18" ry="54" fill="none" stroke="#008dc9" stroke-width="1.2" opacity="0.4"/>
  <line x1="46" y1="100" x2="154" y2="100" stroke="#008dc9" stroke-width="1.2" opacity="0.4"/>
  <line x1="56" y1="80" x2="144" y2="80" stroke="#008dc9" stroke-width="1" opacity="0.3"/>
  <line x1="56" y1="120" x2="144" y2="120" stroke="#008dc9" stroke-width="1" opacity="0.3"/>

  <!-- Rod of Asclepius (Staff with Serpent) -->
  <!-- Staff -->
  <line x1="100" y1="36" x2="100" y2="162" stroke="#b45309" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="100" cy="36" r="4.5" fill="#f59e0b" />
  
  <!-- Coiled Serpent -->
  <path d="M 94 150 C 112 144, 114 130, 98 122 C 84 114, 88 98, 104 92 C 118 86, 116 70, 100 64 C 92 60, 94 50, 102 46" 
        fill="none" stroke="#008dc9" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Snake Eye/Head -->
  <circle cx="102" cy="46" r="2.2" fill="#0f172a" />
</svg>
