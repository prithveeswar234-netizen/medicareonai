<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Dr. Pruthve Health Hub - Official Clinical Doctor Emblem (Hackathon Ready) -->
  <defs>
    <linearGradient id="doctorTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pulseGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f766e" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Outer Protective Medical Shield / Circle -->
  <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="url(#doctorTealGrad)" stroke-width="4.5" filter="url(#badgeShadow)"/>
  <circle cx="100" cy="100" r="85" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>

  <!-- Clinical Concentric Ring -->
  <circle cx="100" cy="100" r="68" fill="#ffffff" stroke="#ccfbf1" stroke-width="2"/>

  <!-- Doctor's Medical Plus Cross (Clean Cyan / Teal Badge) -->
  <path d="M 85 46 H 115 V 76 H 145 V 106 H 115 V 136 H 85 V 106 H 55 V 76 H 85 Z" fill="#e0f2fe" opacity="0.6"/>

  <!-- Modern Doctor Stethoscope (Coiled Around Central Axis) -->
  <!-- Left Binaural Tube -->
  <path d="M 68 56 C 58 68, 56 98, 70 122 C 80 138, 92 142, 104 138" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
  <!-- Right Binaural Tube -->
  <path d="M 132 56 C 142 68, 144 98, 130 122" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
  <!-- Stethoscope Earpieces -->
  <circle cx="68" cy="56" r="4.5" fill="#0d9488"/>
  <circle cx="132" cy="56" r="4.5" fill="#0d9488"/>

  <!-- Stethoscope Chest Piece / Diaphragm -->
  <circle cx="108" cy="138" r="8" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <circle cx="108" cy="138" r="4.5" fill="#10b981"/>

  <!-- Golden Medical Caduceus Rod -->
  <line x1="100" y1="38" x2="100" y2="155" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="100" cy="38" r="5.5" fill="#fbbf24"/>

  <!-- Coiled Medical Healing Ribbon / Wings -->
  <path d="M 88 56 C 98 48, 102 48, 112 56" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 92 146 C 108 140, 110 126, 96 118 C 82 110, 84 96, 100 90 C 114 84, 112 72, 100 66" 
        fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Real-Time Vital Pulse / Heartbeat Lifeline Wave across front -->
  <path d="M 44 100 H 68 L 74 88 L 82 114 L 92 74 L 102 122 L 112 92 L 118 108 L 126 98 L 132 100 H 156" 
        fill="none" stroke="url(#pulseGreenGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
